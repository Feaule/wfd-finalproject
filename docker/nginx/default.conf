server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Log
    access_log /var/log/nginx/apartin_access.log;
    error_log  /var/log/nginx/apartin_error.log;

    # Max upload size (untuk bukti pembayaran)
    client_max_body_size 20M;

    # Semua request diarahkan ke index.php (Laravel routing)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP files -> teruskan ke PHP-FPM container
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Sembunyikan file dot (keamanan)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
