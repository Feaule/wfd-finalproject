version: '3.8'

services:

  # ── PHP-FPM (Laravel App) ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apartin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - apartin_network
    depends_on:
      - db

  # ── Nginx Web Server ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: apartin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - apartin_network

  # ── MySQL Database ────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: apartin_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: apartin
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: apartin_user
      MYSQL_PASSWORD: apartin_pass
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - apartin_network

networks:
  apartin_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
